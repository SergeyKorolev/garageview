<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #111827;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid #e5e7eb;
    }
    .header .logo { height: 22px; }
    .header .logo-light { display: none; }
    .header .user-name { font-size: 12px; color: #6b7280; margin-left: auto; }

    /* Login prompt */
    .login-prompt {
      padding: 40px 20px;
      text-align: center;
      color: #6b7280;
    }
    .login-prompt h2 {
      font-size: 16px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 8px;
    }
    .login-prompt p { font-size: 13px; line-height: 1.5; margin-bottom: 16px; }
    .login-prompt a {
      display: inline-block;
      padding: 8px 20px;
      background: #2563eb;
      color: white;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    .login-prompt a:hover { background: #1d4ed8; }

    /* Collection list */
    .collection-list { max-height: 300px; overflow-y: auto; }
    .collection-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid #f3f4f6;
      cursor: pointer;
      transition: background 0.15s;
      text-decoration: none;
      color: inherit;
    }
    .collection-item:hover { background: #f3f4f6; }
    .collection-item:last-child { border-bottom: none; margin-bottom: 6px; }
    .collection-name {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .collection-count {
      font-size: 11px;
      color: #9ca3af;
      flex-shrink: 0;
    }
    .collection-default {
      font-size: 9px;
      font-weight: 700;
      color: #2563eb;
      background: #eff6ff;
      padding: 1px 5px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* Loading */
    .loading {
      padding: 40px 20px;
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
    }

    /* Empty */
    .empty {
      padding: 30px 20px;
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
    }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      body { background: #1f2937; color: #f3f4f6; }
      .header { border-bottom-color: #374151; }
      .header .user-name { color: #9ca3af; }
      .header .logo-dark { display: none; }
      .header .logo-light { display: inline; }
      .login-prompt { color: #9ca3af; }
      .login-prompt h2 { color: #f3f4f6; }
      .collection-item { border-bottom-color: #374151; }
      .collection-item:hover { background: #293548; }
      .collection-count { color: #6b7280; }
      .collection-default { color: #60a5fa; background: #1e3a5f; }
      .loading { color: #6b7280; }
      .empty { color: #6b7280; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="popup.js"></script>
</body>
</html>
