# Kamal 2 deployment configuration for <%= ENV.fetch("DEPLOY_DOMAIN") %>
# Docs: https://kamal-deploy.org

service: garageview
image: <%= ENV.fetch("DEPLOY_IMAGE") %>

servers:
  web:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>
  worker:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>
    cmd: bundle exec sidekiq

proxy:
  ssl: true
  host: <%= ENV.fetch("DEPLOY_DOMAIN") %>
  app_port: 3000
  healthcheck:
    path: /up
    interval: 3

registry:
  username: <%= ENV.fetch("DEPLOY_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "1"
    RAILS_SERVE_STATIC_FILES: "1"
    APP_HOST: <%= ENV.fetch("DEPLOY_DOMAIN") %>
  secret:
    - SECRET_KEY_BASE
    - DATABASE_URL
    - REDIS_URL
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - OPENAI_API_KEY_PRODUCTION
    - MOBILE_DE_SCRAPER_API_URL
    - MOBILE_DE_SCRAPER_API_KEY
    - MAILTRAP_API_TOKEN
    - MAILTRAP_WELCOME_TEMPLATE_UUID
    - MAILTRAP_DELETED_TEMPLATE_UUID
    - MAILTRAP_COLLECTION_INVITE_TEMPLATE_UUID

accessories:
  db:
    image: postgres:16-alpine
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_DB: garageview_production
        POSTGRES_USER: garageview
      secret:
        - POSTGRES_PASSWORD
    directories:
      - garageview_postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    port: "127.0.0.1:6379:6379"
    directories:
      - garageview_redis_data:/data

# Useful aliases
aliases:
  console: app exec -i --reuse "bin/rails console"
  shell: app exec -i --reuse "bash"
  logs: app logs
  dbc: app exec -i --reuse "bin/rails dbconsole"
