services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: garageview
      POSTGRES_PASSWORD: password
      POSTGRES_DB: garageview_development
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
